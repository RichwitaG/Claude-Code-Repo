name: Supabase keep-alive

# Keeps a FREE-tier Supabase project from auto-pausing (which happens after
# ~7 days of inactivity). This makes a tiny authenticated request to the REST
# API on a schedule, which counts as project activity.
#
# IMPORTANT: GitHub only runs scheduled workflows that live on the repo's
# DEFAULT branch (main). This file must be on main to actually fire.
#
# Note: the key below is the PUBLIC publishable/anon key — the same one the
# website already ships to every visitor. It is safe to commit; Row-Level
# Security protects the data, not this key.

on:
  schedule:
    - cron: "23 13 * * *"   # once daily, 13:23 UTC
  workflow_dispatch:          # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: "https://kkpknyrybfavvvbcmyza.supabase.co"
          SUPABASE_KEY: "sb_publishable_YUhRbJVFsGeRgc-QvwsMMQ_b_AwdmFh"
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/swipes?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "Supabase responded HTTP $code"
          if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
            echo "Keep-alive OK."
          else
            echo "Keep-alive FAILED (HTTP $code)."
            exit 1
          fi
